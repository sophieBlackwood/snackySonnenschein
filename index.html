<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snacky Sonnenschein</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="todo-wrapper">
  <div class="todo-card">

    <h1 class="lighthouse-title">☀️ Snacky Sonnenschein</h1>
    <p class="subtitle">Jesus wants YOU for a Sunbeam</p>

    <!-- INPUT -->
    <div class="todo-input-group">
      <input 
        type="text" 
        id="task-input" 
        placeholder="What needs doing?" 
        autocomplete="off"
      />
      <button id="add-task" class="btn" aria-label="Add task">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <!-- TASK LIST -->
    <ul id="task-list" class="todo-list"></ul>

    <hr class="divider">

    <!-- SQUIRREL SECTION -->
    <div class="squirrel-section">
      <h2>🐿 Wizard Squirrel on a Roomba</h2>
      <p id="squirrel-fact"></p>
      <button id="new-fact" class="btn-secondary">More!</button>
    </div>

  </div>
</main>

<!-- FLOATING TRASH BIN -->
<div id="trash-bin" aria-label="Clear all tasks">
  <i class="fa-solid fa-trash"></i>
</div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
