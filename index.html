<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snacky Sonnenschein</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preload" as="image" href="sun1.jpg">
</head>

<body>
<main class="todo-wrapper">
  <div class="todo-card">
    <h1 class="lighthouse-title">☀️ Snacky Sonnenschein</h1>
    <div class="todo-input-group">
      <input type="text" id="task-input" placeholder="What needs doing?" autocomplete="off"/>
      <button id="add-task" class="btn">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <ul id="task-list" class="todo-list"></ul>
    <hr class="divider">

    <div class="squirrel-section">
      <h2>Ask the Wizard Squirrel</h2>
      <p id="squirrel-fact"></p>
      <button id="new-fact" class="btn-secondary">More!</button>
    </div>

  </div>
</main>

<!-- Trash Bin -->
<div id="trash-bin" title="Drag task here to delete">
  <i class="fa-solid fa-trash"></i>
</div>

<script src="script.js"></script>
</body>
</html>
