<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snacky Sonnenschein</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="todo-wrapper">
  <div class="todo-card">

    <h1 class="lighthouse-title">☀️ Snacky Sonnenschein</h1>
    <p class="subtitle">Small steps. Steady sunshine.</p>

    <div class="todo-input-group">
      <input type="text" id="task-input" placeholder="What needs doing?" autocomplete="off"/>
      <button id="add-task" class="btn">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <ul id="task-list" class="todo-list"></ul>

    <hr class="divider">

    <div class="squirrel-section">
      <h2>🐿 Tiny Squirrel Wisdom</h2>
      <p id="squirrel-fact"></p>
      <button id="new-fact" class="btn-secondary">another nugget</button>
    </div>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
